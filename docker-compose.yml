version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cricket_master_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:/app/data/cricket_master.db
      - JWT_ACCESS_SECRET=production_jwt_access_super_secret_key_change_me_in_prod
      - JWT_REFRESH_SECRET=production_jwt_refresh_super_secret_key_change_me_in_prod
      - JWT_ACCESS_EXPIRES_IN=1d
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=1000
    volumes:
      - backend_data:/app/data
      - backend_backups:/app/backups
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cricket_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cricket_master_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - cricket_network

volumes:
  backend_data:
  backend_backups:

networks:
  cricket_network:
    driver: bridge
