services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cricket_master_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres.vbuaxjynxdljktxdjqwz:cricket22027-i9@aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=10&pool_timeout=20&connect_timeout=30}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-RBJObPoGyqZ498pCEK4QiFC5maMElJ/c6zq+azJFA2ERkIot8+o752/yyQ/qI8aSuOpMhov61ZiFgGFuJMHmqQ==}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-RBJObPoGyqZ498pCEK4QiFC5maMElJ/c6zq+azJFA2ERkIot8+o752/yyQ/qI8aSuOpMhov61ZiFgGFuJMHmqQ==_refresh}
      - JWT_ACCESS_EXPIRES_IN=1d
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173,http://frontend:80
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=1000
      - SUPABASE_PROJECT_ID=vbuaxjynxdljktxdjqwz
      - SUPABASE_URL=https://vbuaxjynxdljktxdjqwz.supabase.co
      - SUPABASE_REST_URL=https://vbuaxjynxdljktxdjqwz.supabase.co/rest/v1/
    volumes:
      - backend_data:/app/data
      - backend_backups:/app/backups
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cricket_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cricket_master_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - cricket_network

volumes:
  backend_data:
  backend_backups:

networks:
  cricket_network:
    driver: bridge
